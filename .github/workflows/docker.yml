name: Docker

on: [push, pull_request]

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: echo "POSTGRES_PASSWORD=ci-password" > .env

      - name: Start database and API and dashboard
        run: docker compose up --build -d --wait db api dashboard

      - name: Run NetWatch on the demo capture
        run: docker compose run --rm --build netwatch

      - name: Check that the API returns the alerts
        run: |
          curl -sf --retry 10 --retry-connrefused --retry-delay 2 \
            http://localhost:8000/alerts/summary | tee summary.json
          grep -q PORT_SCAN summary.json
          grep -q SUSPICIOUS_DNS summary.json
          grep -q TRAFFIC_SPIKE summary.json

            - name: Check that the dashboard is served
        run: |
          curl -sf --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8080/ | grep -q 'id="root"'
          curl -sf http://localhost:8080/alerts/summary | grep -q PORT_SCAN
          

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v